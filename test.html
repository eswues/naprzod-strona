<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stowarzyszenie Naprzód</title>
    <style>
        /* General Styles for the body and container */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Neutral background for contrast */
            font-family: sans-serif; /* A fallback font */
        }

        /* Main advertisement container - mimicking the green background */
        .advert-container {
            width: 100%;
            max-width: 800px; /* Adjust size as needed */
            padding: 40px 20px;
            background-color: #58b948; /* Primary background color (Green) */
            text-align: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            /* Optional: to simulate the textured look from the image */
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.1) 0,
                rgba(255, 255, 255, 0.1) 1px,
                transparent 1px,
                transparent 5px
            );
        }

        /* Top text: RUSZAMY */
        .header-text {
            font-size: 1.5em;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            color: #3f3f3f; /* Darker color as in the image */
        }

        /* Main action text: NAPRZÓD! */
        .main-call-to-action {
            display: inline-block;
            background-color: white;
            color: #58b948; /* Green text on white background */
            font-size: 5em;
            font-weight: bold;
            padding: 5px 20px;
            margin-bottom: 20px;
            line-height: 1;
            /* Optional: to simulate the slight outline/shadow effect */
            text-shadow: 1px 1px 0 #ccc;
        }

        /* Sub-text: BO POLSKA TO NIE JEST PROJEKT POLITYCZNY, TO NASZ DOM. */
        .sub-text {
            font-size: 1em;
            margin-top: -10px;
            margin-bottom: 30px;
            color: #3f3f3f; /* Darker color as in the image */
        }

        /* Join button container */
        .join-button-box {
            display: inline-block;
            background-color: #ef4e7c; /* Pink background */
            color: white;
            padding: 15px 30px;
            margin-bottom: 30px;
            position: relative;
            cursor: pointer; /* Indicates it's clickable */
        }

        /* Join button text: DOŁĄCZ DO NAS! */
        .join-button-text {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* Cursor icon simulation */
        .cursor-icon {
            position: absolute;
            right: -25px; /* Adjust position relative to the box */
            top: 50%;
            transform: translateY(-50%);
            font-size: 2em;
            /* Simulating a simple pointer using an arrow/triangle */
            content: '>'; /* or use a custom image/font icon */
            color: #3f3f3f;
            line-height: 1;
        }

        /* Footer text block */
        .footer-mission {
            font-size: 0.9em;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Social media links section */
        .social-media {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 1.2em; /* For the text link */
            color: #3f3f3f;
        }

        /* Social icons placeholder - using text/font for simplicity */
        .social-icon {
            font-size: 1.5em;
            color: #3f3f3f; /* Darker color */
            text-decoration: none;
        }

        /* Placeholder for the central logo image (represented by a green square) */
        .logo-placeholder {
            width: 30px;
            height: 30px;
            background-color: #58b948; /* Green color for the logo */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #3f3f3f; /* Dark border outside the white */
        }
    </style>
</head>
<body>

    <div class="advert-container">
        <div class="header-text">RUSZAMY</div>

        <div class="main-call-to-action">NAPRZÓD!</div>

        <div class="sub-text">BO POLSKA TO NIE JEST PROJEKT POLITYCZNY, TO NASZ DOM.</div>

        <div class="join-button-box">
            <span class="join-button-text">DOŁĄCZ DO NAS!</span>
            <span class="cursor-icon">▶</span>
        </div>

        <div class="footer-mission">
            I DZIAŁAJ NA RZECZ POLSKI BARDZIEJ<br>
            EUROPEJSKIEJ, SOLIDARNEJ I DEMOKRATYCZNEJ.
        </div>

        <div class="social-media">
            <a href="#" class="social-icon">f</a>
            <span>/stowarzyszenienaprzod</span>

            <div class="logo-placeholder"></div>

            <a href="#" class="social-icon">
                <span style="font-size: 1em;">📷</span>
            </a>
            <a href="#" class="social-icon">
                <span style="font-size: 1em;">▶️</span>
            </a>
            <a href="#" class="social-icon">
                <span style="font-size: 1em;">X</span>
            </a>
            <a href="#" class="social-icon">
                <span style="font-size: 1em;">🎵</span>
            </a>
            <span>/naprzod_pl</span>
        </div>
    </div>

</body>
</html>
